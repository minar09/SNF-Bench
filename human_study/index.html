<!doctype html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root{--bg:#f7f7f5;--card:#fff;--ink:#171717;--muted:#666;--line:#ddd;--blue:#2563eb;--red:#b42318}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(1120px,100%);margin:auto;padding:20px}header{display:flex;align-items:center;gap:16px}h1{flex:1;margin:0;font-size:20px}
    .muted{color:var(--muted)}.progress{height:7px;margin:12px 0 18px;border-radius:8px;background:#e5e5e5;overflow:hidden}.progress span{display:block;width:0;height:100%;background:var(--blue)}
    .card{padding:20px;background:var(--card);border:1px solid var(--line);border-radius:12px}.intro{max-width:760px;margin:auto}.hidden{display:none!important}
    li{margin:.4rem 0}.row{display:flex;gap:10px}input[type=text]{flex:1;min-width:0;padding:11px;border:1px solid var(--line);border-radius:8px;font:inherit}
    button{padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;font:600 15px inherit;cursor:pointer}button:hover:not(:disabled),button:focus-visible{border-color:var(--blue);outline:2px solid #2563eb33}button.primary{background:var(--blue);border-color:var(--blue);color:#fff}button:disabled{opacity:.5;cursor:wait}
    .question{margin:0;font-size:20px}.prompt{margin:5px 0 14px}.players{display:grid;grid-template-columns:1fr 1fr;gap:14px}.player{overflow:hidden;border-radius:9px;background:#080808}.player iframe{display:block;width:100%;aspect-ratio:16/9;border:0}.label{padding:8px;color:#fff;text-align:center;font-weight:700}
    .choices{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px}.report{display:block;margin-top:12px}.status{min-height:24px;margin-top:10px;color:var(--muted)}.error{color:var(--red)}
    @media(max-width:720px){.players{grid-template-columns:1fr}.choices{grid-template-columns:1fr}}
  </style>
</head>
<body><main>
  <header><h1 id="title">Loading…</h1><span id="counter" class="muted"></span></header>
  <div class="progress"><span id="progress"></span></div>
  <section id="intro" class="card intro">
    <p id="instructions"></p>
    <ul><li>Play both videos and watch each at least once.</li><li>Answer only the question shown; do not judge overall quality.</li><li>Choose <strong>About the same</strong> when there is no meaningful difference.</li></ul>
    <div class="row"><input id="rater" type="text" maxlength="100" autocomplete="off" placeholder="Participant ID"><button id="start" class="primary">Start</button></div>
    <div id="introStatus" class="status error" role="alert"></div>
  </section>
  <section id="trial" class="card hidden">
    <h2 id="question" class="question"></h2><p id="prompt" class="prompt muted"></p>
    <div class="players">
      <div class="player"><iframe id="left" title="Video 1" allow="autoplay; fullscreen" allowfullscreen></iframe><div class="label">Video 1</div></div>
      <div class="player"><iframe id="right" title="Video 2" allow="autoplay; fullscreen" allowfullscreen></iframe><div class="label">Video 2</div></div>
    </div>
    <div class="choices"><button data-choice="left">Video 1</button><button data-choice="same">About the same</button><button data-choice="right">Video 2</button></div>
    <label class="report"><input id="problem" type="checkbox"> A video did not load or play correctly</label><div id="status" class="status" role="status"></div>
  </section>
  <section id="done" class="card intro hidden"><h2>Thank you</h2><p>Your responses have been recorded. You may close this tab.</p></section>
</main>
<script>
  'use strict';
  const $=id=>document.getElementById(id);let trials=[],position=0,shownAt=0,raterId='',saving=false;
  function fail(id,e){$(id).textContent=e&&e.message?e.message:String(e||'Unknown error');$(id).classList.add('error')}
  google.script.run.withSuccessHandler(cfg=>{$('title').textContent=cfg.title;$('instructions').textContent=cfg.instructions}).withFailureHandler(e=>fail('introStatus',e)).getConfig();
  $('start').onclick=()=>{raterId=$('rater').value.trim();if(!raterId){fail('introStatus','Enter a participant ID.');$('rater').focus();return}$('start').disabled=true;$('introStatus').textContent='Preparing trials…';google.script.run.withSuccessHandler(data=>{trials=data;position=0;$('intro').classList.add('hidden');$('trial').classList.remove('hidden');render()}).withFailureHandler(e=>{$('start').disabled=false;fail('introStatus',e)}).getTrials(raterId)};
  $('rater').onkeydown=e=>{if(e.key==='Enter')$('start').click()};
  function buttons(disabled){document.querySelectorAll('[data-choice]').forEach(b=>b.disabled=disabled)}
  function render(){if(position>=trials.length){$('trial').classList.add('hidden');$('done').classList.remove('hidden');$('counter').textContent='';$('progress').style.width='100%';return}const t=trials[position];$('counter').textContent=`${position+1} / ${trials.length}`;$('progress').style.width=`${position/trials.length*100}%`;$('question').textContent=t.question;$('prompt').textContent=t.prompt;$('left').src=t.left;$('right').src=t.right;$('problem').checked=false;$('status').classList.remove('error');$('status').textContent='Play both videos, then select an answer.';buttons(false);saving=false;shownAt=Date.now()}
  function answer(choice){if(saving)return;saving=true;buttons(true);$('status').textContent='Saving…';const t=trials[position];google.script.run.withSuccessHandler(()=>{position++;render()}).withFailureHandler(e=>{saving=false;buttons(false);fail('status',e)}).submitResponse({raterId:raterId,trialId:t.trialId,choice:choice,dwellMs:Date.now()-shownAt,playbackProblem:$('problem').checked})}
  document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>answer(b.dataset.choice));
</script>
</body></html>
